services:
  app:
    # Fixed names instead of compose's default `zednews-app-1` etc - avoids the
    # numeric suffix invoke tasks and ad-hoc `docker exec` commands would
    # otherwise need to hardcode or guess.
    container_name: zednews-app
    build:
      context: .
      args:
        DEVELOPMENT: ${DEVELOPMENT:-0}
    command: tail -f /dev/null
    volumes:
      - ./:/home/zednews/app/
    env_file:
      - .env
    depends_on:
      - db

  db:
    container_name: zednews-db
    # pgvector/pgvector:0.8.1-pg15 = postgres:15 + the `vector` extension compiled in.
    # Neon (prod) already ships pgvector; local dev needs the extension in the image.
    image: pgvector/pgvector:0.8.1-pg15
    expose:
      - 5432
    environment:
      - POSTGRES_USER=zednews_dev_user
      - POSTGRES_PASSWORD=zednews_dev_password
      - POSTGRES_DB=zednews_dev_db
      - PGUSER=zednews_dev_user
      - PGPASSWORD=zednews_dev_password
      - PGDATABASE=zednews_dev_db
      - POSTGRES_HOST_AUTH_METHOD=trust
    volumes:
      - postgres_data:/var/lib/postgresql/data/
      # fresh volume only - see docker/pg-init/init.sql
      - ./docker/pg-init:/docker-entrypoint-initdb.d

  pgweb:
    container_name: zednews-pgweb
    image: sosedoff/pgweb:0.17.0
    ports:
      - 8081:8081
    environment:
      - PGWEB_DATABASE_URL=postgres://zednews_dev_user:zednews_dev_password@db:5432/zednews_dev_db?sslmode=disable
    depends_on:
      - db

volumes:
  postgres_data:
